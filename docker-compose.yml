name: codearena

services:
  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
      - hocuspocus

  backend:
    ports:
      - "8000:8000"
    build:
      context: ./backend/
    volumes:
      - type: bind
        source: ./backend/
        target: /app/
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - db
      - redis
    env_file:
      - db.env
      - backend.env

  db:
    image: postgres:18.4
    env_file: "db.env"
    volumes:
      - pgdata:/var/lib/postgresql/
    
  redis:
    image: redis:7
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

  hocuspocus:
    build:
      context: ./yjs-server
    ports:
    - "1234:1234"
    volumes:
    - ./yjs-server:/app
    - /app/node_modules
    env_file:
    - backend.env
    depends_on:
    - backend

volumes:
  pgdata:
  redis_data:
