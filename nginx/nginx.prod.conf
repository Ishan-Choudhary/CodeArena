upstream backend_django {
    server backend:8000;
}

upstream backend_yjs    {
    server hocuspocus:1234;
}

server  {
    listen 80;
    server_name codearenahq.dev www.codearenahq.dev;
    return 301 https://$host$request_uri;
}

server  {
    listen 443 ssl;
    server_name codearenahq.dev www.codearenahq.dev;

    ssl_certificate /etc/letsencrypt/live/codearenahq.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/codearenahq.dev/privkey.pem;

    location /  {
        root /usr/share/nginx/html;
        index index.html;

        try_files $uri $uri/ /index.html;
    }

    location /api/  {
        proxy_pass http://backend_django;

        proxy_set_header HOST $host;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        alias /app/staticfiles/;
    }

    location /ws/   {
        proxy_pass http://backend_django;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }


    location /yjs  {
        proxy_pass http://backend_yjs;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }


}
