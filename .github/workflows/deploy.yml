name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  test:
    name: Run Pytests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build and Test Backend

        run: |
          touch db.env backend.env
          
          echo "POSTGRES_DB=postgres" >> db.env
          echo "POSTGRES_USER=postgres" >> db.env
          echo "POSTGRES_PASSWORD=postgres" >> db.env
          
          echo "SECRET_KEY=dummy-test-key-12345" >> backend.env
          echo "DEBUG=True" >> backend.env
          echo "DJANGO_ADMIN_URL=api/admin/" >> backend.env
          echo "PORT=1234" >> backend.env
          echo "REDIS_HOST=redis" >> backend.env
          echo "REDIS_PORT=6379" >> backend.env
  deploy:
    name: Deploy to DigitalOcean
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Secure SSH and Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{secrets.DO_HOST}}
          username: ${{secrets.DO_USERNAME}}
          key: ${{secrets.DO_SSH_KEY}}
          script: |
            cd ~/CodeArena
            git pull origin main
            docker compose -f docker-compose.prod.yml up -d --build
            docker system prune -f